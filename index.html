const DEMO_SOUNDDESIGN_SRC = `-- demo_sounddesign.lua
-- Showcases Foley's live-editing API: getSpec/setSpec/resetSpec/isOverridden,
-- the TONE_PARAMS/NOISE_PARAMS/CLUSTER_PARAMS parameter tables, and
-- getWaveformPoints -- rendered through Clay.setCustomRenderHandler, the one
-- Clay feature with no built-in visual primitive of its own.

local Clay = require("clay")
local Foley = require("foley")
local Widgets = require("ui_widgets")

local M = {}

-- ── custom render handler: draws a bar waveform from a points array ────────
local function waveformRenderHandler(command)
  local points = command.customData and command.customData.points
  if not points or #points == 0 then return end
  local box = command.boundingBox
  local n = #points
  local halfH = box.height * 0.45
  local midY = box.y + box.height / 2
  love.graphics.setColor(Widgets.palette.mint[1], Widgets.palette.mint[2], Widgets.palette.mint[3], 0.9)
  for i, p in ipairs(points) do
    local x = box.x + (i - 0.5) / n * box.width
    love.graphics.line(x, midY - p * halfH, x, midY + p * halfH)
  end
  love.graphics.setColor(1, 1, 1, 1)
end
Clay.setCustomRenderHandler(waveformRenderHandler)

-- ── state ────────────────────────────────────────────────────────────────
local state = { cue = "tick" }
local waveform = {}
local waveformDirty = true

local function paramsFor(layer)
  if layer.kind == "tone" then return Foley.TONE_PARAMS end
  if layer.kind == "noise" then return Foley.NOISE_PARAMS end
  if layer.kind == "cluster" then return Foley.CLUSTER_PARAMS end
  return {}
end

local function fmtParam(p, v)
  if p.fmt:find("%%d") then
    return string.format(p.fmt, math.floor(v + 0.5))
  end
  return string.format(p.fmt, v)
end

local function refreshWaveform()
  waveform = Foley.getWaveformPoints(state.cue, 80)
  waveformDirty = false
end

local function setLayerParam(key, value)
  local spec = Foley.getSpec(state.cue)
  spec[1][key] = value
  Foley.setSpec(state.cue, spec)
  waveformDirty = true
end

function M.declare()
  if waveformDirty then refreshWaveform() end

  Widgets.panel({
    layout = { direction = "column", childGap = 14, padding = 16, sizing = { width = "grow", height = "grow" } },
  }, function()
    Clay.text("Sound Design -- edit a cue live", { fontId = "title", color = Widgets.palette.text })
    Clay.text("getSpec / setSpec / resetSpec / isOverridden / getWaveformPoints",
      { color = Widgets.palette.textDim, fontSize = 12 })

    Clay.element({
      id = "sounddesign:picker",
      layout = { direction = "column", childGap = 6, sizing = { width = "grow" } },
    }, function()
      for _, family in ipairs(Foley.FAMILIES) do
        Clay.element({ id = "sounddesign:row:" .. family.label, layout = { childGap = 6 }, clip = { horizontal = true } }, function()
          for _, cue in ipairs(family.cues) do
            Widgets.button({
              id = "sounddesign:pick:" .. cue, label = cue, active = state.cue == cue,
              hoverSound = "tick", clickSound = false,
              onClick = function() state.cue = cue; waveformDirty = true end,
            })
          end
        end)
      end
    end)

    local spec = Foley.getSpec(state.cue)
    local layer = spec[1]

    Clay.element({ id = "sounddesign:waverow", layout = { direction = "column", childGap = 10, sizing = { width = "grow" } } }, function()
      Clay.element({
        id = "sounddesign:wave",
        layout = { sizing = { width = "grow", height = Clay.sizing.fixed(120) } },
        backgroundColor = Widgets.palette.panel2,
        cornerRadius = 8,
        custom = { points = waveform },
      })

      Clay.element({ layout = { childGap = 10, sizing = { width = "grow" }, childAlignment = { y = "center" } }, clip = { horizontal = true } }, function()
        Widgets.button({
          id = "sounddesign:play", label = "Play " .. state.cue, clickSound = false,
          onClick = function() Foley.play(state.cue) end,
        })
        Widgets.button({
          id = "sounddesign:reset",
          label = Foley.isOverridden(state.cue) and "Reset to default" or "(using built-in default)",
          clickSound = false,
          onClick = function() Foley.resetSpec(state.cue); waveformDirty = true end,
        })
        Clay.text("layer.kind = " .. layer.kind, { color = Widgets.palette.textDim, fontSize = 12 })
      end)
    end)

    Clay.element({
      id = "sounddesign:params",
      layout = { direction = "column", childGap = 10, sizing = { width = "grow" } },
    }, function()
      for _, p in ipairs(paramsFor(layer)) do
        local raw = layer[p.key]
        if p.nullable then
          local enabled = raw ~= nil
          Widgets.toggle({
            id = "sounddesign:enable:" .. p.key, label = p.label .. " enabled", value = enabled,
            onChange = function(v)
              if v then
                setLayerParam(p.key, raw or p.default or p.min)
              else
                setLayerParam(p.key, nil)
              end
            end,
          })
          if enabled then
            local v = Widgets.slider({
              id = "sounddesign:" .. p.key, label = p.label .. ": " .. fmtParam(p, raw),
              value = raw, min = p.min, max = p.max, step = p.step,
            })
            if v ~= raw then setLayerParam(p.key, v) end
          end
        else
          local v0 = raw or p.min
          local v = Widgets.slider({
            id = "sounddesign:" .. p.key, label = p.label .. ": " .. fmtParam(p, v0),
            value = v0, min = p.min, max = p.max, step = p.step,
          })
          if v ~= v0 then setLayerParam(p.key, v) end
        end
      end
    end)
  end)
end

return M
`;

function defaultConf(w, h) {
  return `function love.conf(t)
    t.identity = "love-live-editor"
    t.window.title = "Preview"
    t.window.width = ${w}
    t.window.height = ${h}
    t.window.resizable = false
end
`;
}

/* ------------------------------------------------------------------ *
 * Small binary helpers
 * ------------------------------------------------------------------ */
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function bytesToB64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(s);
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/* Store-only zip. PhysicsFS reads uncompressed entries, so no deflate needed. */
function zipStore(entries) {
  const enc = new TextEncoder();
  const local = [];
  const central = [];
  let offset = 0;

  for (const e of entries) {
    const name = enc.encode(e.name);
    const crc = crc32(e.data);

    const lh = new Uint8Array(30 + name.length);
    const l = new DataView(lh.buffer);
    l.setUint32(0, 0x04034b50, true);
    l.setUint16(4, 20, true);
    l.setUint16(6, 0x0800, true);
    l.setUint16(8, 0, true);
    l.setUint16(10, 0, true);
    l.setUint16(12, 0x0021, true);
    l.setUint32(14, crc, true);
    l.setUint32(18, e.data.length, true);
    l.setUint32(22, e.data.length, true);
    l.setUint16(26, name.length, true);
    l.setUint16(28, 0, true);
    lh.set(name, 30);
    local.push(lh, e.data);

    const ch = new Uint8Array(46 + name.length);
    const c = new DataView(ch.buffer);
    c.setUint32(0, 0x02014b50, true);
    c.setUint16(4, 20, true);
    c.setUint16(6, 20, true);
    c.setUint16(8, 0x0800, true);
    c.setUint16(10, 0, true);
    c.setUint16(12, 0, true);
    c.setUint16(14, 0x0021, true);
    c.setUint32(16, crc, true);
    c.setUint32(20, e.data.length, true);
    c.setUint32(24, e.data.length, true);
    c.setUint16(28, name.length, true);
    c.setUint32(38, 0, true);
    c.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);

    offset += lh.length + e.data.length;
  }

  const cdSize = central.reduce((n, c) => n + c.length, 0);
  const eocd = new Uint8Array(22);
  const v = new DataView(eocd.buffer);
  v.setUint32(0, 0x06054b50, true);
  v.setUint16(8, entries.length, true);
  v.setUint16(10, entries.length, true);
  v.setUint32(12, cdSize, true);
  v.setUint32(16, offset, true);

  const out = new Uint8Array(offset + cdSize + 22);
  let p = 0;
  for (const chunk of local.concat(central, [eocd])) { out.set(chunk, p); p += chunk.length; }
  return out;
}

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === "undefined") {
    throw new Error("This browser cannot inflate deflate data. Re-zip the archive with no compression.");
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function unzip(bytes) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  const floor = Math.max(0, bytes.length - 22 - 65535);
  for (let i = bytes.length - 22; i >= floor; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Not a zip archive: no end-of-central-directory record.");

  const count = dv.getUint16(eocd + 10, true);
  if (count === 0xFFFF) throw new Error("Zip64 archives are not supported.");

  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  const out = [];

  for (let i = 0; i < count; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("Corrupt central directory at entry " + i + ".");
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const cmtLen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));

    const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    const raw = bytes.subarray(start, start + csize);

    if (!name.endsWith("/")) {
      if (method === 0) out.push({ name, data: raw.slice() });
      else if (method === 8) out.push({ name, data: await inflateRaw(raw) });
      else throw new Error("Unsupported compression method " + method + " for " + name + ".");
    }
    p += 46 + nameLen + extraLen + cmtLen;
  }
  return stripCommonRoot(out);
}

function stripCommonRoot(entries) {
  if (entries.some(e => e.name === "main.lua")) return entries;
  const roots = new Set(entries.map(e => e.name.split("/")[0]));
  if (roots.size !== 1) return entries;
  const prefix = [...roots][0] + "/";
  const stripped = entries.map(e => ({ name: e.name.slice(prefix.length), data: e.data }));
  return stripped.some(e => e.name === "main.lua") ? stripped : entries;
}

-- Auto-added when a Server URL is configured in the editor.
--
-- Usage:
--   local net = require('net')
--   net.connect('play.mygame.com', 443, function(conn)
--     conn:send('hello\\n')
--   end)
--
-- Notes:
--   * Your server must speak WebSocket (not raw TCP). Use gorilla/websocket,
--     ws/websockets, or put websockify in front of a plain TCP server.
--   * TLS is required when the page is served over HTTPS (use wss://).
--   * setsockopt('tcp-nodelay') errors are harmless — the stub returns -50.
--   * Frame messages yourself (e.g. newline-delimited JSON); WebSocket message
--     boundaries do not align with receive() call boundaries.

local socket = require('socket')
local M = {}

-- Async TCP connect. cb(conn) fires once the connection is open.
-- Connection polling is driven by love.update automatically.
function M.connect(host, port, cb)
  local conn = socket.tcp()
  conn:settimeout(0)
  conn:connect(host, port)   -- always EINPROGRESS in this build; safe to ignore
  local prev = love.update
  love.update = function(dt)
    if prev then prev(dt) end
    local _, w = socket.select(nil, { conn }, 0)
    if w[conn] then
      love.update = prev
      cb(conn)
    end
  end
  return conn
end

return M
`;

end

function log(stream, text) {
  const box = el("console");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
  const line = document.createElement("div");
  line.className = stream;
  line.textContent = text;
  box.appendChild(line);
  while (box.childElementCount > MAX_LOG_LINES) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
  if (document.body.classList.contains("tab-game") && window.innerWidth <= 700) {
    document.body.classList.add("has-log-badge");
    document.body.classList.toggle("strip-err",   stream === "err");
    document.body.classList.toggle("strip-fatal", stream === "fatal");
    el("console-strip").textContent = text;
  }
}

/* ------------------------------------------------------------------ *
 * Runtime loading
 * ------------------------------------------------------------------ */
async function loadRuntime() {
  let glueText;

  if (HAS_INLINE_RUNTIME) {
    glueText = dec.decode(b64ToBytes(INLINE_GLUE_B64));
    if (INLINE_WASM_B64.charAt(0) !== "_" && INLINE_WASM_B64.length > 0) {
      wasmBytes = b64ToBytes(INLINE_WASM_B64);
    }
    log("sys", "Runtime loaded from the inlined build.");
  } else {
    if (location.protocol === "file:") {
      throw new Error("This copy has no inlined runtime, and fetch() cannot read love.js over file://. Serve the folder over HTTP instead.");
    }
    const res = await fetch("love.js");
    if (!res.ok) throw new Error("GET love.js returned HTTP " + res.status + ". Put love.js and love.wasm next to this page.");
    glueText = await res.text();
    const wres = await fetch("love.wasm").catch(() => null);
    if (wres && wres.ok) wasmBytes = new Uint8Array(await wres.arrayBuffer());
    log("sys", "Runtime loaded from ./love.js next to this page.");
  }

  if (/\bPThread\b/.test(glueText)) {
    log("err", "This love.js build uses pthreads. It needs COOP/COEP headers and will not boot without them. Rebuild with: love.js game.love out -c");
  }

  glueSource = glueText;
  if (location.protocol !== "file:") {
    glueUrl = URL.createObjectURL(new Blob([glueText], { type: "text/javascript" }));
  }

  if (wasmBytes) {
    try {
      wasmModule = await WebAssembly.compile(wasmBytes);
    } catch (e) {
      wasmModule = null;
      log("err", "Precompiling the wasm module failed, falling back to per-run compilation. " + e);
    }
  }

  runtimeReady = true;
  el("run").disabled = false;
  el("exporthtml").disabled = false;
  el("exportzip").disabled = false;
  el("exporteditorzip").disabled = false;
}

  const entries = [];
  for (const f of state.files.values()) {
    entries.push({ name: f.name, data: f.binary ? f.bytes : enc.encode(f.text) });
  }
  return zipStore(entries);
}

function run() {
  if (!runtimeReady) { log("err", "The LÖVE runtime is still loading."); return; }
  if (!state.files.has("main.lua")) { log("err", "No main.lua in the project. LÖVE will not start without it."); return; }

  stop(true);
  el("console").replaceChildren();
  saveProject();

  setStatus("booting", "Booting");
  el("boottime").textContent = "—";
  el("idle").classList.add("hidden");

  pendingBoot = buildLove();

  const frame = document.createElement("iframe");
  frame.title = "Game preview";
  frame.allow = "autoplay";
  frame.srcdoc = runnerHtml();
  el("screen").appendChild(frame);
  stage = frame;

  el("stop").disabled = false;
  el("run").textContent = "Restart";
}

function stop(quiet) {
  if (stage) { stage.remove(); stage = null; }
  pendingBoot = null;
  state.paused = false;
  el("stop").disabled = true;
  el("pause").disabled = true;
  el("pause").textContent = "Pause";
  el("run").textContent = "Run";
  el("idle").classList.remove("hidden");
  if (!quiet) { setStatus("idle", "Idle"); el("boottime").textContent = "—"; }
}

function togglePause() {
  if (!stage) return;
  state.paused = !state.paused;
  stage.contentWindow.postMessage({ type: state.paused ? "pause" : "resume" }, "*");
  el("pause").textContent = state.paused ? "Resume" : "Pause";
  setStatus(state.paused ? "paused" : "running", state.paused ? "Paused" : "Running");
}

window.addEventListener("message", ev => {
  if (!stage || ev.source !== stage.contentWindow) return;
  const m = ev.data;
  if (!m || typeof m !== "object") return;

  switch (m.type) {
    case "hello": {
      const payload = {
        type: "boot",
        love: pendingBoot,
        memory: INITIAL_MEMORY,
        glueUrl: glueUrl,
        glueSource: glueUrl ? null : glueSource,
        serverUrl: state.serverUrl
      };
      if (wasmModule) payload.wasmModule = wasmModule;
      else if (wasmBytes) payload.wasmBinary = wasmBytes;

      try {
        stage.contentWindow.postMessage(payload, "*");
      } catch (e) {
        delete payload.wasmModule;
        if (wasmBytes) payload.wasmBinary = wasmBytes;
        stage.contentWindow.postMessage(payload, "*");
      }
      pendingBoot = null;
      break;
    }
    case "running":
      setStatus("running", "Running");
      el("boottime").textContent = "boot " + m.ms + " ms";
      stage.contentWindow.focus();
      break;
    case "caps":
      el("pause").disabled = !m.pause;
      if (!m.pause) el("pause").title = "This love.js build does not export pauseMainLoop.";
      break;
    case "log":
      log(m.stream, m.text);
      if (m.stream === "err") setStatus("error", "Error");
      break;
    case "shortcut":
      if (m.key === "s") saveProject();
      run();
      break;
    case "fatal":
      log("fatal", m.text);
      setStatus("error", "Error");
      break;
  }
});

/* ------------------------------------------------------------------ *
 * Files and tabs
 * ------------------------------------------------------------------ */
let editorLoaded = false;

/* The textarea is empty until a file is loaded into it. Without this guard the
   first sync would overwrite that file's real contents with an empty string. */
function syncActiveFile() {
  if (!editorLoaded) return;
  const f = state.files.get(state.active) || state.archive.get(state.active);
  if (f && !f.binary && window.editor) {
    f.text = window.editor.state.doc.toString();
    f.cmState = window.editor.state;
  }
}

function selectFile(name) {
  syncActiveFile();
  const isArchive = state.archive.has(name);
  let f = state.files.get(name) || state.archive.get(name);
  if (!f) return;
  state.active = name;
  const code = el("editor-container");
  const note = el("assetnote");
  
  const dName = isArchive ? (f.archiveName || f.name) : f.name;
  el("editor-filename").textContent = dName + (isArchive ? " (Archived)" : "");
  el("editor-btn-restore").classList.toggle("hidden", !isArchive);
  el("editor-btn-delete").classList.toggle("hidden", isArchive || dName === "main.lua");
  
  if (window.innerWidth <= 700) {
    document.body.classList.remove("tab-files", "tab-game");
    document.body.classList.add("tab-editor");
    document.body.classList.remove("has-log-badge", "strip-err", "strip-fatal");
    const tF = document.getElementById("tab-files");
    const tE = document.getElementById("tab-editor");
    const tG = document.getElementById("tab-game");
    if (tF) tF.setAttribute("aria-selected", "false");
    if (tE) tE.setAttribute("aria-selected", "true");
    if (tG) tG.setAttribute("aria-selected", "false");
  }

  if (f.binary) {
    editorLoaded = false;
    code.classList.add("hidden");
    note.classList.remove("hidden");
    note.innerHTML = "";
    const strong = document.createElement("strong");
    strong.textContent = f.name;
    note.append(strong, document.createTextNode(`Binary asset, ${f.bytes.length.toLocaleString()} bytes.`),
      document.createTextNode("Packed into the .love as-is."));
  } else {
    note.classList.add("hidden");
    code.classList.remove("hidden");
    if (window.editor) {
      if (!f.cmState && window.createEditorState) f.cmState = window.createEditorState(f.text);
      if (f.cmState) window.editor.setState(f.cmState);
    }
    editorLoaded = true;
  }
  renderTabs();
}

function renderTabs() {
  const bar = el("tabs");
  bar.replaceChildren();

  const head = document.createElement("div");
  head.className = "sidebar-head";
  head.innerHTML = `<span>FILES</span> <div style="display: flex; gap: 2px;"><button title="New Folder" id="new-folder-btn"><i class="ti ti-folder-plus"></i></button><button title="New File" id="new-file-btn"><i class="ti ti-file-plus"></i></button></div>`;
  bar.appendChild(head);
  head.querySelector("#new-file-btn").addEventListener("click", newFile);
  head.querySelector("#new-folder-btn").addEventListener("click", newFolder);

  const groups = { "": [] };
  for (const f of state.files.values()) {
    const parts = f.name.split("/");
    if (parts.length > 1) {
      const folder = parts[0];
      if (!groups[folder]) groups[folder] = [];
      groups[folder].push(f);
    } else {
      groups[""].push(f);
    }
  }

  const createTabEl = (f) => {
    const tab = document.createElement("div");
    tab.className = "tab" + (f.binary ? " asset" : "");
    tab.setAttribute("role", "tab");
    tab.tabIndex = 0;
    tab.setAttribute("aria-selected", String(f.name === state.active));
    const parts = f.name.split("/");
    tab.append(document.createTextNode(parts[parts.length - 1]));

    if (f.name !== "main.lua") {
      const x = document.createElement("button");
      x.className = "x";
      x.innerHTML = "<i class='ti ti-x' style='font-size:14px;vertical-align:middle;'></i>";
      x.setAttribute("aria-label", "Remove " + f.name);
      x.title = "Remove " + f.name;
      x.addEventListener("click", ev => {
        ev.stopPropagation();
        if (confirm(`Delete ${f.name}?`)) deleteActiveFile(f.name);
      });
      tab.append(x);
    }

    tab.addEventListener("click", () => selectFile(f.name));
    tab.addEventListener("keydown", ev => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectFile(f.name); }
    });
    return tab;
  };

  for (const f of groups[""]) bar.appendChild(createTabEl(f));

  for (const [folder, files] of Object.entries(groups)) {
    if (folder === "") continue;
    const details = document.createElement("details");
    details.className = "folder";
    if (state.active.startsWith(folder + "/")) details.open = true;
    const summary = document.createElement("summary");
    summary.textContent = folder + "/";
    details.appendChild(summary);
    for (const f of files) details.appendChild(createTabEl(f));
    bar.appendChild(details);
  }

  if (state.archive.size > 0) {
    const details = document.createElement("details");
    details.className = "folder archive";
    const summary = document.createElement("summary");
    summary.style.display = "flex";
    summary.style.justifyContent = "space-between";
    summary.style.alignItems = "center";
    summary.innerHTML = `<span style="display:flex;align-items:center;gap:6px;"><i class="ti ti-trash"></i> Archive</span> <button title="Empty Archive" style="background:none;border:none;color:inherit;cursor:pointer;font-size:10px;text-transform:uppercase;opacity:0.6;display:flex;align-items:center;gap:4px;" onmouseover="this.style.opacity=1;this.style.color='var(--pink)'" onmouseout="this.style.opacity=0.6;this.style.color='inherit'"><i class="ti ti-trash-x"></i> Empty</button>`;
    
    const emptyBtn = summary.querySelector("button");
    emptyBtn.addEventListener("click", ev => {
      ev.preventDefault();
      if (confirm("Are you sure you want to permanently delete all archived files? This cannot be undone.")) {
        state.archive.clear();
        saveProject();
        renderTabs();
      }
    });
    
    details.appendChild(summary);

    for (const f of state.archive.values()) {
      const tab = document.createElement("div");
      tab.className = "tab" + (f.binary ? " asset" : "");
      tab.setAttribute("role", "button");
      tab.tabIndex = 0;
      const dName = f.archiveName || f.name;
      tab.setAttribute("aria-selected", String(dName === state.active));
      
      const nameNode = document.createTextNode(dName);
      tab.appendChild(nameNode);
      
      const restoreBtn = document.createElement("button");
      restoreBtn.className = "x restore";
      restoreBtn.innerHTML = "<i class='ti ti-refresh'></i>";
      restoreBtn.title = "Restore " + dName;
      restoreBtn.addEventListener("click", ev => {
        ev.stopPropagation();
        restoreArchivedFile(dName);
      });
      tab.appendChild(restoreBtn);
      
      tab.addEventListener("click", () => selectFile(dName));
      tab.addEventListener("keydown", ev => {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectFile(dName); }
      });
      
      details.appendChild(tab);
    }
    bar.appendChild(details);
  }

  const missingFilesContainer = document.createElement("div");
  missingFilesContainer.style.padding = "16px 8px";
  missingFilesContainer.style.display = "flex";
  missingFilesContainer.style.flexDirection = "column";
  missingFilesContainer.style.gap = "8px";

  const addMissingBtn = (filename, templateContent, icon) => {
    if (!state.files.has(filename)) {
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.innerHTML = `<i class='ti ${icon}'></i> Add ${filename}`;
      btn.style.justifyContent = "center";
      btn.onclick = () => {
        const text = typeof templateContent === "function" ? templateContent() : templateContent;
        if (window.globalHistory) {
          window.globalHistory.createFile(filename, text);
        } else {
          state.files.set(filename, { name: filename, text: text, cmState: null });
          selectFile(filename);
          renderTabs();
        }
        saveProject();
      };
      missingFilesContainer.appendChild(btn);
    }
  };

  addMissingBtn("conf.lua", () => defaultConf(state.frame.w, state.frame.h), "ti-settings");
  addMissingBtn("net.lua", NET_LUA, "ti-world");
  addMissingBtn("fetch.lua", FETCH_LUA, "ti-download");

  if (missingFilesContainer.children.length > 0) {
    bar.appendChild(missingFilesContainer);
  }
}

function restoreArchivedFile(dName) {
  const f = state.archive.get(dName);
  if (!f) return;
  
  let restoreName = f.originalName || f.name;
  let c = 1;
  while (state.files.has(restoreName)) {
     const parts = (f.originalName || f.name).split(".");
     if (parts.length > 1) {
       const ext = parts.pop();
       restoreName = parts.join(".") + ` (${c++}).` + ext;
     } else {
       restoreName = `${f.originalName || f.name} (${c++})`;
     }
  }
  
  if (window.globalHistory) {
    state.archive.delete(dName);
    window.globalHistory.createFile(restoreName, f.text);
  } else {
    state.files.set(restoreName, { ...f, name: restoreName });
    state.archive.delete(dName);
    selectFile(restoreName);
    renderTabs();
  }
  saveProject();
}

function deleteActiveFile(name) {
  const f = state.files.get(name);
  if (!f || name === "main.lua") return;
  
  if (window.globalHistory) {
    const text = f.cmState ? f.cmState.doc.toString() : f.text;
    window.globalHistory.deleteFile(name, text);
  } else {
    const wasActive = (state.active === name);
    state.files.delete(name);
    if (wasActive) {
      state.active = "main.lua";
      selectFile("main.lua");
    }
    renderTabs();
  }
  saveProject();
}

function newFolder() {
  const name = prompt("Folder name (relative to the project root):", "assets");
  if (!name) return;
  const clean = name.trim().replace(/^\/+|\/+$/g, "");
  if (!clean) return;
  const keepFile = clean + "/.keep";
  if (state.files.has(keepFile)) { selectFile(keepFile); return; }
  
  if (window.globalHistory) {
    state.active = keepFile;
    window.globalHistory.createFile(keepFile, "");
  } else {
    state.files.set(keepFile, { name: keepFile, binary: false, text: "" });
    selectFile(keepFile);
  }
  saveProject();
}

function newFile() {
  const name = prompt("File name (relative to the project root):", "player.lua");
  if (!name) return;
  const clean = name.trim().replace(/^\/+/, "");
  if (!clean) return;
  if (state.files.has(clean)) { selectFile(clean); return; }
  
  if (window.globalHistory) {
    window.globalHistory.createFile(clean, "");
  } else {
    state.files.set(clean, { name: clean, binary: false, text: "" });
    selectFile(clean);
  }
  saveProject();
}

async function addUploads(fileList) {
  // Flush any pending edit into the file being replaced first. Then stop
  // syncing: selectFile() below calls syncActiveFile() again before it
  // reassigns state.active, and if an uploaded file reuses the currently
  // open name (almost always main.lua), that second sync would clobber the
  // just-loaded content with this now-stale textarea value.
  syncActiveFile();
  editorLoaded = false;

  for (const file of fileList) {
    try {
      if (/\.(love|zip)$/i.test(file.name)) {
        const entries = await unzip(new Uint8Array(await file.arrayBuffer()));
        state.files.clear();
        for (const e of entries) {
          if (TEXT_EXT.test(e.name)) state.files.set(e.name, { name: e.name, binary: false, text: dec.decode(e.data) });
          else state.files.set(e.name, { name: e.name, binary: true, bytes: e.data });
        }
        log("sys", `Imported ${entries.length} file(s) from ${file.name}.`);
      } else if (TEXT_EXT.test(file.name)) {
        state.files.set(file.name, { name: file.name, binary: false, text: await file.text() });
        log("sys", "Loaded " + file.name + ".");
      } else {
        const bytes = new Uint8Array(await file.arrayBuffer());
        state.files.set(file.name, { name: file.name, binary: true, bytes });
        log("sys", `Loaded ${file.name} (${bytes.length.toLocaleString()} bytes).`);
      }
    } catch (e) {
      log("err", `Could not load ${file.name}: ${e.message}`);
    }
  }

  if (!state.files.has("main.lua")) log("err", "The project has no main.lua. Add one before running.");
  if (!state.files.has("conf.lua")) {
    log("sys", "No conf.lua in this project, so the Screen preset only resizes the preview frame. Add a conf.lua to set the real window size.");
  }
  state.active = state.files.has(state.active) ? state.active : (state.files.has("main.lua") ? "main.lua" : [...state.files.keys()][0]);
  selectFile(state.active);
  saveProject();
}

/* Shared boot logic for exported runner pages (self-booting variants of the
   runner-source script above: no host/postMessage handshake). `loadDataJs` is
   a snippet that resolves the glue text, wasm bytes and .love bytes however
   the particular export gets them (inlined base64 vs. fetch()) and then
   calls boot(glueText, wasmBytes, loveBytes). */
function bootScript(loadDataJs, serverUrl) {
  return `
(function () {
  var MEMORY = ${INITIAL_MEMORY};
  var canvas = document.getElementById('canvas');
  var errBox = document.getElementById('err');
  function showError(t) {
    errBox.style.display = 'block';
    errBox.textContent += (errBox.textContent ? '\\n' : '') + t;
  }

  function writeFile(Module, name, bytes) {
    if (typeof Module.FS_createDataFile === 'function') {
      Module.FS_createDataFile('/', name, bytes, true, true, true);
    } else if (Module.FS && typeof Module.FS.writeFile === 'function') {
      Module.FS.writeFile('/' + name, bytes);
    } else {
      throw new Error('This love.js build exports neither FS_createDataFile nor FS.');
    }
  }

  function boot(glueText, wasmBytes, loveBytes) {
    var Module = {
      canvas: canvas,
      arguments: ['./game.love'],
      INITIAL_MEMORY: MEMORY,
      TOTAL_MEMORY: MEMORY,
      print: function (t) { console.log(t); },
      printErr: function (t) { console.error(t); showError(String(t)); },
      setStatus: function (t) { if (t) console.log(t); },
      preRun: [function () {
        try {
          writeFile(Module, 'game.love', loveBytes);
        } catch (e) {
          showError('Could not write game.love into the virtual filesystem. ' + e);
        }
      }],
      onRuntimeInitialized: function () { canvas.focus(); },
      onAbort: function (what) { showError('Runtime aborted: ' + what); },
      instantiateWasm: function (imports, success) {
        WebAssembly.instantiate(wasmBytes, imports).then(
          function (result) { success(result.instance, result.module); },
          function (e) { showError('WebAssembly.instantiate failed: ' + e); }
        );
        return {};
      }
    };
    ${serverUrl ? `Module.websocket = { url: ${JSON.stringify(serverUrl)}, subprotocol: 'binary' };` : ''}
    window.Module = Module;

    var s = document.createElement('script');
    s.textContent = glueText;
    document.body.appendChild(s);

    var factory = window.Love;
    if (typeof factory === 'function') {
      try {
        var ready = factory(Module);
        if (ready && typeof ready.catch === 'function') {
          ready.catch(function (e) { showError('Module initialisation rejected: ' + e); });
        }
      } catch (e) {
        showError('Love(Module) threw: ' + e);
      }
    } else {
      console.log('No Love() factory found; assuming a self-booting glue build.');
    }
    canvas.focus();
  }

  ${loadDataJs}

  document.addEventListener('mousedown', function () { canvas.focus(); });
  window.addEventListener('error', function (e) {
    showError((e.message || 'Uncaught error') + (e.lineno ? ' (line ' + e.lineno + ')' : ''));
  });
})();
`;
}

/* Wraps a boot script (from bootScript()) in the canvas/error-panel page shell
   shared by every export flavour. */
function runnerPageHtml(bootJs) {

<title>LÖVE game</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}

/* Everything (love.js glue, love.wasm, the .love archive) is inlined as
   base64 so the file runs standalone, including over file://. */
function standaloneHtml({ loveB64, glueB64, wasmB64 }) {
  const loadDataJs = `function b64ToBytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  var glueText = new TextDecoder().decode(b64ToBytes("${glueB64}"));
  var wasmBytes = b64ToBytes("${wasmB64}");
  var loveBytes = b64ToBytes("${loveB64}");
  boot(glueText, wasmBytes, loveBytes);`;

  return runnerPageHtml(bootScript(loadDataJs, state.serverUrl));
}

/* Fetches love.js, love.wasm and game.love as sibling files instead of
   inlining them, for the "download zip" export. Needs to be served over
   HTTP -- fetch() can't read local files over file://. */
function zipIndexHtml() {
  const loadDataJs = `Promise.all([
    fetch('love.js').then(function (r) { if (!r.ok) throw new Error('GET love.js failed: HTTP ' + r.status); return r.text(); }),
    fetch('love.wasm').then(function (r) { if (!r.ok) throw new Error('GET love.wasm failed: HTTP ' + r.status); return r.arrayBuffer(); }),
    fetch('game.love').then(function (r) { if (!r.ok) throw new Error('GET game.love failed: HTTP ' + r.status); return r.arrayBuffer(); })
  ]).then(function (results) {
    boot(results[0], new Uint8Array(results[1]), new Uint8Array(results[2]));
  }).catch(function (e) { showError(String(e.message || e)); });`;

  return runnerPageHtml(bootScript(loadDataJs, state.serverUrl));
}

function exportHtml() {
  if (!runtimeReady) { log("err", "The LÖVE runtime is still loading."); return; }
  if (!state.files.has("main.lua")) { log("err", "No main.lua in the project. LÖVE will not start without it."); return; }
  if (!wasmBytes) { log("err", "No wasm binary loaded; can't build a self-contained export."); return; }

  const loveB64 = bytesToB64(buildLove());
  const glueB64 = bytesToB64(enc.encode(glueSource));
  const wasmB64 = bytesToB64(wasmBytes);

  const html = standaloneHtml({ loveB64, glueB64, wasmB64 });
  const blob = new Blob([html], { type: "text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function exportEditorZip() {
  if (!runtimeReady) { log("err", "The LÖVE runtime is still loading."); return; }
  if (!state.files.has("main.lua")) { log("err", "No main.lua in the project. Cannot export without it."); return; }
  if (!wasmBytes) { log("err", "No wasm binary loaded; can't build an editor export."); return; }

  let indexHtmlSource = "";
  try {
    const res = await fetch("index.html");
    if (!res.ok) throw new Error("bad status");
    indexHtmlSource = await res.text();
  } catch (err) {
    log("err", "Could not fetch index.html. Export failed.");
    return;
  }

  let loveApiSource = "";
  try {
    const res = await fetch("love_api.js");
    if (!res.ok) throw new Error("bad status");
    loveApiSource = await res.text();
  } catch (err) {
    log("err", "Could not fetch love_api.js. Export failed.");
    return;
  }

  syncActiveFile();
  const payload = {
    active: state.active,
    frame: state.frame,
    serverUrl: state.serverUrl,
    layout: {
      split: document.documentElement.style.getPropertyValue("--split") || "50%",
      console: document.documentElement.style.getPropertyValue("--console") || "250px"
    },
    files: [...state.files.values()].map(f =>
      f.binary ? { name: f.name, binary: true, b64: bytesToB64(f.bytes) } : { name: f.name, binary: false, text: (f.cmState ? f.cmState.doc.toString() : f.text) }),
    archive: [...state.archive.values()].map(f =>
      f.binary ? { name: f.name, binary: true, b64: bytesToB64(f.bytes) } : { name: f.name, binary: false, text: f.text })
  };

  const uniqueId = Date.now().toString(36) + Math.random().toString(36).substr(2);
  const scriptTag = `
<script type="application/json" id="injected-project">
${JSON.stringify(payload).replace(/</g, '\\u003c')}
<\/script>
<script>window.__STORAGE_KEY__ = "love-live-editor/project/" + "${uniqueId}";<\/script>`;
  const injectedHtml = indexHtmlSource.replace("</head>", scriptTag + "\n</head>");

  const entries = [
    { name: "index.html", data: enc.encode(injectedHtml) },
    { name: "love_api.js", data: enc.encode(loveApiSource) },
    { name: "love.js", data: enc.encode(glueSource) },
    { name: "love.wasm", data: wasmBytes }
  ];

  const blob = new Blob([zipStore(entries)], { type: "application/zip" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "editor-project.zip";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function exportZip() {
  if (!runtimeReady) { log("err", "The LÖVE runtime is still loading."); return; }
  if (!state.files.has("main.lua")) { log("err", "No main.lua in the project. LÖVE will not start without it."); return; }
  if (!wasmBytes) { log("err", "No wasm binary loaded; can't build a static export."); return; }

  const entries = [
    { name: "index.html", data: enc.encode(zipIndexHtml()) },
    { name: "love.js", data: enc.encode(glueSource) },
    { name: "love.wasm", data: wasmBytes },
    { name: "game.love", data: buildLove() }
  ];

  const blob = new Blob([zipStore(entries)], { type: "application/zip" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "game.zip";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ------------------------------------------------------------------ *
 * Persistence
 * ------------------------------------------------------------------ */
async function saveProject() {
  syncActiveFile();
  const payload = {
    active: state.active,
    frame: state.frame,
    serverUrl: state.serverUrl,
    layout: {
      split: document.documentElement.style.getPropertyValue("--split") || "50%",
      console: document.documentElement.style.getPropertyValue("--console") || "250px"
    },
    files: [...state.files.values()].map(f =>
      f.binary ? { name: f.name, binary: true, b64: bytesToB64(f.bytes) } : { name: f.name, binary: false, text: (f.cmState ? f.cmState.doc.toString() : f.text) }),
    archive: [...state.archive.values()].map(f =>
      f.binary ? { name: f.name, binary: true, b64: bytesToB64(f.bytes) } : { name: f.name, binary: false, text: f.text })
  };
  try {
    await idbKeyval.set(STORAGE_KEY, payload);
  } catch (e) {
    log("err", "Could not autosave to IndexedDB. Export the .love to keep your work.");
  }
}

async function loadProject() {
  let p = null;
  try { p = await idbKeyval.get(STORAGE_KEY); } catch (e) { p = null; }
  if (!p) {
    // Check localStorage fallback for backward compatibility
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) p = JSON.parse(raw);
    } catch (e) { }
  }

  // If IDB is empty, load from injected project if available
  if (!p) {
    const injectedEl = document.getElementById("injected-project");
    if (injectedEl) {
      try {
        p = JSON.parse(injectedEl.textContent);
      } catch (e) {
        console.error("Failed to parse injected project JSON.", e);
      }
    }
  }
  if (!p) return false;
  try {
    state.files.clear();
    state.archive.clear();
    for (const f of p.files) {
      if (f.binary) state.files.set(f.name, { name: f.name, binary: true, bytes: b64ToBytes(f.b64) });
      else state.files.set(f.name, { name: f.name, binary: false, text: f.text });
    }
    if (p.archive) {
      for (const f of p.archive) {
        if (f.binary) state.archive.set(f.name, { name: f.name, binary: true, bytes: b64ToBytes(f.b64) });
        else state.archive.set(f.name, { name: f.name, binary: false, text: f.text });
      }
    }
    if (p.frame) state.frame = p.frame;
    if (p.layout) {
      if (p.layout.split) document.documentElement.style.setProperty("--split", p.layout.split);
      if (p.layout.console) document.documentElement.style.setProperty("--console", p.layout.console);
    }
    state.active = state.files.has(p.active) ? p.active : "main.lua";
    if (p.serverUrl) {
      state.serverUrl = p.serverUrl;
      el('serverurl').value = p.serverUrl;
    }
    return state.files.size > 0;
  } catch (e) {
    return false;
  }
}

async function resetProject() {
  if (!confirm("Replace the current project with the starter example?")) return;
  // selectFile() below calls syncActiveFile() before it reassigns state.active,
  // which would otherwise write the stale on-screen text for whatever tab was
  // open back over main.lua (same bug class as addUploads() above -- see the
  // run-love2d-live-editor skill notes).
  editorLoaded = false;
  
  state.files.clear();
  
  const injectedEl = document.getElementById("injected-project");
  if (injectedEl) {
    try {
      const p = JSON.parse(injectedEl.textContent);
      for (const f of p.files) {
        if (f.binary) state.files.set(f.name, { name: f.name, binary: true, bytes: b64ToBytes(f.b64) });
        else state.files.set(f.name, { name: f.name, binary: false, text: f.text });
      }
      state.archive.clear();
      if (p.archive) {
        for (const f of p.archive) {
          if (f.binary) state.archive.set(f.name, { name: f.name, binary: true, bytes: b64ToBytes(f.b64) });
          else state.archive.set(f.name, { name: f.name, binary: false, text: f.text });
        }
      }
      if (p.frame) state.frame = p.frame;
      if (p.layout) {
        if (p.layout.split) document.documentElement.style.setProperty("--split", p.layout.split);
        if (p.layout.console) document.documentElement.style.setProperty("--console", p.layout.console);
      }
      if (p.serverUrl) {
        state.serverUrl = p.serverUrl;
        el('serverurl').value = p.serverUrl;
      }
      if (p.active && state.files.has(p.active)) state.active = p.active;
    } catch (e) {
      console.error("Failed to parse injected project JSON on reset.", e);
    }
  } else {
    for (const f of starterFiles(state.frame.w, state.frame.h)) state.files.set(f.name, { name: f.name, binary: false, text: f.text });
    
    if (typeof LOVE_API_ZIP_B64 !== "undefined") {
      try {
        const bytes = b64ToBytes(LOVE_API_ZIP_B64);
        const entries = await unzip(bytes);
        for (const e of entries) {
          if (TEXT_EXT.test(e.name)) state.files.set(e.name, { name: e.name, binary: false, text: dec.decode(e.data) });
          else state.files.set(e.name, { name: e.name, binary: true, bytes: e.data });
        }
      } catch (err) {
        console.error("Failed to unpack love-api on reset", err);
      }
    }
  }

  state.active = "main.lua";
  selectFile("main.lua");
  saveProject();
  log("sys", "Project reset to the starter example.");
}

function onEdit() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProject, 400);
  if (el("autorun").checked) {

    autorunTimer = setTimeout(run, AUTORUN_DELAY);

/* ------------------------------------------------------------------ *
 * Preview sizing
 * ------------------------------------------------------------------ */
function fitDevice() {
  const area = el("stagearea").getBoundingClientRect();
  const device = el("device");
  const w = device.offsetWidth;
  const h = device.offsetHeight;
  if (!w || !h) return;
  const k = Math.min(1, (area.width - 40) / w, (area.height - 40) / h);
  document.documentElement.style.setProperty("--k", Math.max(0.15, k).toFixed(4));
}

function applyFrame(w, h) {
  state.frame = { w, h };
  const screen = el("screen");
  screen.style.width = w + "px";
  screen.style.height = h + "px";
  el("dims").textContent = `${w} × ${h}`;

  const conf = state.files.get("conf.lua");
  if (conf && !conf.binary) {
    syncActiveFile();
    if (state.active !== "conf.lua" && conf.cmState) conf.text = conf.cmState.doc.toString();
    
    conf.text = conf.text
      .replace(/(t\.window\.width\s*=\s*)\d+/, "$1" + w)
      .replace(/(t\.window\.height\s*=\s*)\d+/, "$1" + h);
      
    if (state.active === "conf.lua" && window.editor) {
      window.editor.dispatch({changes: {from: 0, to: window.editor.state.doc.length, insert: conf.text}});
    } else if (conf.cmState) {
      conf.cmState = conf.cmState.update({changes: {from: 0, to: conf.cmState.doc.length, insert: conf.text}}).state;
    }
  }

  fitDevice();
  saveProject();

  // conf.lua's window size is only read at boot, so a resize while the game
  // is running would otherwise leave it drawing at the old resolution.
  if (stage) run();
}

/* ------------------------------------------------------------------ *
 * Split grip
 * ------------------------------------------------------------------ */
function initGrip() {
  const grip = el("grip");
  let dragging = false;

  const move = ev => {
    if (!dragging) return;
    const min = 300;
    const max = window.innerWidth - 340;
    const x = Math.min(max, Math.max(min, ev.clientX));
    document.documentElement.style.setProperty("--split", x + "px");
    fitDevice();
  };

  grip.addEventListener("pointerdown", ev => {
    dragging = true;
    grip.classList.add("dragging");
    grip.setPointerCapture(ev.pointerId);
  });
  grip.addEventListener("pointermove", move);
  grip.addEventListener("pointerup", ev => {
    dragging = false;
    grip.classList.remove("dragging");
    grip.releasePointerCapture(ev.pointerId);
  });
  grip.addEventListener("keydown", ev => {
    const step = ev.shiftKey ? 60 : 20;
    const cur = el("grip").getBoundingClientRect().left;
    if (ev.key === "ArrowLeft") { document.documentElement.style.setProperty("--split", (cur - step) + "px"); fitDevice(); }
    if (ev.key === "ArrowRight") { document.documentElement.style.setProperty("--split", (cur + step) + "px"); fitDevice(); }
  });
}

function initConsoleGrip() {
  const grip = el("grip-v");
  let dragging = false;

  const move = ev => {
    if (!dragging) return;
    const min = 50;
    const editorRect = el("editor-container").parentElement.getBoundingClientRect();
    const max = editorRect.height - 100;
    const h = Math.min(max, Math.max(min, editorRect.bottom - ev.clientY));
    document.documentElement.style.setProperty("--console", h + "px");
  };

  grip.addEventListener("pointerdown", ev => {
    dragging = true;
    grip.classList.add("dragging");
    grip.setPointerCapture(ev.pointerId);
  });
  grip.addEventListener("pointermove", move);
  grip.addEventListener("pointerup", ev => {
    dragging = false;
    grip.classList.remove("dragging");
    grip.releasePointerCapture(ev.pointerId);
  });
}

/* ------------------------------------------------------------------ *
 * Device drag (repositioning the phone on the bench)
 * ------------------------------------------------------------------ */
function initDevicePan() {
  const device = el("device");
  let dragging = false;
  let startX = 0, startY = 0, originX = 0, originY = 0, panX = 0, panY = 0;

  device.addEventListener("pointerdown", ev => {
    if (ev.target.closest(".screen")) return;
    dragging = true;
    startX = ev.clientX;
    startY = ev.clientY;
    originX = panX;
    originY = panY;
    device.classList.add("dragging");
    device.setPointerCapture(ev.pointerId);
  });

  device.addEventListener("pointermove", ev => {
    if (!dragging) return;
    let nx = originX + (ev.clientX - startX);
    let ny = originY + (ev.clientY - startY);

    // Keep at least a corner of the phone reachable so it can always be dragged back.
    const area = el("stagearea").getBoundingClientRect();
    const k = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--k")) || 1;
    const visW = device.offsetWidth * k, visH = device.offsetHeight * k;
    const margin = 32;
    const maxX = area.width / 2 + visW / 2 - margin;
    const maxY = area.height / 2 + visH / 2 - margin;
    nx = Math.max(-maxX, Math.min(maxX, nx));
    ny = Math.max(-maxY, Math.min(maxY, ny));

    panX = nx;
    panY = ny;
    device.style.setProperty("--dx", panX + "px");
    device.style.setProperty("--dy", panY + "px");
  });

  const endDrag = ev => {
    if (!dragging) return;
    dragging = false;
    device.classList.remove("dragging");
    device.releasePointerCapture(ev.pointerId);
  };
  device.addEventListener("pointerup", endDrag);
  device.addEventListener("pointercancel", endDrag);

  device.addEventListener("dblclick", ev => {
    if (ev.target.closest(".screen")) return;
    panX = 0;
    panY = 0;
    device.style.setProperty("--dx", "0px");
    device.style.setProperty("--dy", "0px");
  });

  device.addEventListener("reset-pan", () => {
    panX = 0;
    panY = 0;
    device.style.setProperty("--dx", "0px");
    device.style.setProperty("--dy", "0px");
  });
}

/* ------------------------------------------------------------------ *
 * Wiring
 * ------------------------------------------------------------------ */
async function init() {
  const select = el("preset");
  for (const [label, w, h] of PRESETS) {
    const opt = document.createElement("option");
    opt.value = w + "x" + h;
    opt.textContent = `${label} — ${w}×${h}`;
    select.appendChild(opt);
  }

  if (!(await loadProject())) {
    for (const f of starterFiles(state.frame.w, state.frame.h)) state.files.set(f.name, { name: f.name, binary: false, text: f.text });
  }

  await window.editorReady;
  selectFile(state.active);

  select.value = state.frame.w + "x" + state.frame.h;
  if (select.selectedIndex < 0) select.selectedIndex = 1;
  const [pw, ph] = select.value.split("x").map(Number);
  applyFrame(pw, ph);
  document.addEventListener("keydown", ev => {
    const mod = ev.metaKey || ev.ctrlKey;
    if (mod && ev.key === "Enter") { ev.preventDefault(); run(); }
    if (mod && ev.key.toLowerCase() === "s") { ev.preventDefault(); saveProject(); run(); }
    if (mod && ev.key.toLowerCase() === "c") {
      if (window.getSelection().toString().trim()) return;
      if (document.activeElement && document.activeElement.closest(".cm-editor")) return;
      
      const logText = Array.from(el("console").childNodes).map(n => n.textContent).join("\n");
      if (logText) {
        ev.preventDefault();
        navigator.clipboard.writeText(logText).then(() => {
          log("sys", "Console output copied to clipboard.");
        }).catch(err => {
          logErr("Failed to copy clipboard: " + err);
        });
      }
    }
  });

  el("editor-btn-delete").addEventListener("click", () => {
    if (confirm(`Delete ${state.active}?`)) deleteActiveFile(state.active);
  });
  el("editor-btn-restore").addEventListener("click", () => {
    restoreArchivedFile(state.active);
  });

  el("serverurl").addEventListener("change", () => {
    const url = el("serverurl").value.trim();
    el("serverurl").value = url;
    state.serverUrl = url;
    if (url) {
      let tabsDirty = false;
      if (!state.files.has("net.lua")) {
        state.files.set("net.lua", { name: "net.lua", binary: false, text: NET_LUA });
        tabsDirty = true;
      }
      if (!state.files.has("fetch.lua")) {
        state.files.set("fetch.lua", { name: "fetch.lua", binary: false, text: FETCH_LUA });
        tabsDirty = true;
      }
      if (tabsDirty) renderTabs();
    }
    saveProject();
  });

  el("run").addEventListener("click", run);
  el("stop").addEventListener("click", () => stop(false));
  el("pause").addEventListener("click", togglePause);
  el("reset").addEventListener("click", resetProject);
  el("export-menu-btn").addEventListener("click", () => el("export-dialog").showModal());
  el("export").addEventListener("click", () => { el("export-dialog").close(); exportLove(); });
  el("exporthtml").addEventListener("click", () => { el("export-dialog").close(); exportHtml(); });
  el("exportzip").addEventListener("click", () => { el("export-dialog").close(); exportZip(); });
  el("exporteditorzip").addEventListener("click", () => { el("export-dialog").close(); exportEditorZip(); });
  el("copylog").addEventListener("click", () => {
    const logText = Array.from(el("console").childNodes).map(n => n.textContent).join("\n");
    if (!logText) return;
    navigator.clipboard.writeText(logText).then(() => {
      log("sys", "Console output copied to clipboard.");
    }).catch(err => logErr("Failed to copy clipboard: " + err));
  });
  el("clearlog").addEventListener("click", () => {
    el("console").replaceChildren();
    document.body.classList.remove("has-log-badge", "strip-err", "strip-fatal");
  });
  el("load").addEventListener("click", () => el("filepicker").click());
  el("filepicker").addEventListener("change", ev => {
    addUploads([...ev.target.files]);
    ev.target.value = "";
  });
  select.addEventListener("change", () => {
    const [w, h] = select.value.split("x").map(Number);
    el("device").dispatchEvent(new Event("reset-pan"));
    applyFrame(w, h);
  });

  // Mobile tab switching
  document.body.classList.add("tab-files"); // Default to files so they can pick main.lua

  function switchTab(tab) {
    document.body.classList.toggle("tab-files",  tab === "files");
    document.body.classList.toggle("tab-editor", tab === "editor");
    document.body.classList.toggle("tab-game",   tab === "game");
    el("tab-files").setAttribute("aria-selected",  String(tab === "files"));
    el("tab-editor").setAttribute("aria-selected", String(tab === "editor"));
    el("tab-game").setAttribute("aria-selected",   String(tab === "game"));
    if (tab === "editor") document.body.classList.remove("has-log-badge", "strip-err", "strip-fatal");
    if (tab === "game") requestAnimationFrame(() => requestAnimationFrame(fitDevice));
  }

  el("tab-files").addEventListener("click",  () => switchTab("files"));
  el("tab-editor").addEventListener("click", () => switchTab("editor"));
  el("tab-game").addEventListener("click",   () => switchTab("game"));
  el("console-strip").addEventListener("click", () => switchTab("editor"));

  function initSwipe() {
    const area = document.querySelector(".split");
    let sx = 0, sy = 0, locked = false;
    area.addEventListener("touchstart", ev => {
      if (window.innerWidth > 700 || ev.target.closest(".device")) return;
      sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; locked = false;
    }, { passive: true });
    area.addEventListener("touchend", ev => {
      if (window.innerWidth > 700 || locked) return;
      const dx = ev.changedTouches[0].clientX - sx;
      const dy = ev.changedTouches[0].clientY - sy;
      if (Math.abs(dx) < 60 || Math.abs(dy) > 40) return;
      locked = true;
      let tabs = ["files", "editor", "game"];
      let cur = document.body.classList.contains("tab-files") ? 0 : document.body.classList.contains("tab-game") ? 2 : 1;
      let next = cur + (dx < 0 ? 1 : -1);
      if (next >= 0 && next <= 2) switchTab(tabs[next]);
    }, { passive: true });
  }

  initGrip();
  initConsoleGrip();
  initDevicePan();
  initSwipe();
  new ResizeObserver(fitDevice).observe(el("stagearea"));
  window.addEventListener("resize", fitDevice);
  window.addEventListener("beforeunload", saveProject);

  el("run").disabled = true;
  setStatus("idle", "Loading runtime");

  loadRuntime().then(() => {
    setStatus("idle", "Idle");
    log("sys", "Ready. Ctrl+Enter runs, Ctrl+S saves and runs.");
  }).catch(err => {
    setStatus("error", "No runtime");
    log("fatal", String(err.message || err));
  });
}

init();
