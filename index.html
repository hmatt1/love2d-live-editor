<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LÖVE live editor</title>
<style>
:root {
  --ink: #14131a;
  --ink-2: #1c1a24;
  --ink-3: #2b2836;
  --ink-4: #383345;
  --bench: #cfcabd;
  --bench-2: #b6b0a1;
  --bench-3: #9d9686;
  --bench-txt: #2b2823;
  --pink: #e8489b;
  --amber: #d99a3f;
  --mint: #63c7a6;
  --txt: #d8d4e2;
  --txt-dim: #7f7994;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --lh: 20px;
  --split: 50%;
  --k: 1;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--ink);
  color: var(--txt);
  font: 13px/1.5 var(--mono);
}
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-rows: 46px 1fr; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 8px;
  padding: 0 12px;
  background: var(--ink-2);
  border-bottom: 1px solid var(--ink-3);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.topbar > * { flex-shrink: 0; }
.mark {
  display: flex; align-items: center; gap: 7px;
  margin-right: 6px; padding-right: 12px;
  border-right: 1px solid var(--ink-3);
  color: var(--pink);
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
}
.mark svg { width: 13px; height: 13px; fill: currentColor; display: block; }
.spacer { flex: 1; }

.btn {
  padding: 6px 12px;
  background: transparent;
  border: 1px solid var(--ink-3);
  border-radius: 3px;
  color: var(--txt);
  font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: #241f31; border-color: var(--ink-4); }
.btn:disabled { opacity: .3; cursor: not-allowed; }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #190a12; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #f45ba9; border-color: #f45ba9; }

.toggle {
  display: flex; align-items: center; gap: 6px;
  color: var(--txt-dim);
  font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
  cursor: pointer; user-select: none;
}
.toggle input { accent-color: var(--pink); margin: 0; }

/* ---------- split ---------- */
.split {
  display: grid;
  grid-template-columns: minmax(300px, var(--split)) 5px minmax(340px, 1fr);
  min-height: 0;
}
.grip { background: var(--ink-3); cursor: col-resize; }
.grip:hover, .grip.dragging { background: var(--pink); }

/* ---------- editor pane ---------- */
.editor {
  display: grid; grid-template-rows: 32px 1fr auto;
  min-width: 0; min-height: 0;
  background: var(--ink);
}
.tabs {
  display: flex; align-items: stretch;
  background: var(--ink-2);
  border-bottom: 1px solid var(--ink-3);
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 7px;
  padding: 0 10px 0 12px;
  border: 0; border-right: 1px solid var(--ink-3);
  background: transparent;
  color: var(--txt-dim);
  font-size: 11px; white-space: nowrap; cursor: pointer;
}
.tab:hover { color: var(--txt); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--txt); box-shadow: inset 0 2px 0 var(--pink); }
.tab .x { opacity: 0; padding: 0 2px; border: 0; background: none; color: inherit;
  font-size: 13px; line-height: 1; border-radius: 2px; cursor: pointer; }
.tab:hover .x { opacity: .55; }
.tab .x:hover { opacity: 1; color: var(--pink); }
.tab.asset { font-style: italic; }
.tab-add { padding: 0 12px; color: var(--txt-dim); }
.tab-add:hover { color: var(--pink); }

.edit-wrap { display: flex; min-height: 0; overflow: hidden; }
.gutter {
  flex: 0 0 auto; padding: 12px 10px 12px 12px;
  overflow: hidden;
  color: #4d475e; text-align: right;
  line-height: var(--lh);
  user-select: none;
  border-right: 1px solid var(--ink-2);
  background: var(--ink);
}
#code {
  flex: 1; min-width: 0;
  padding: 12px 16px 12px 12px;
  border: 0; resize: none;
  background: var(--ink); color: var(--txt);
  line-height: var(--lh);
  white-space: pre; overflow: auto; tab-size: 4;
  outline: none;
}
#code::selection { background: #4a2440; }
.asset-note {
  flex: 1; display: grid; place-content: center; gap: 6px;
  color: var(--txt-dim); text-align: center; padding: 24px;
}
.asset-note strong { color: var(--txt); font-weight: 600; }

/* ---------- console ---------- */
.console-head {
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px; height: 26px;
  background: var(--ink-2);
  border-top: 1px solid var(--ink-3);
  color: var(--txt-dim);
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
}
.console-head button {
  margin-left: auto; padding: 0; border: 0; background: none;
  color: var(--txt-dim); font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; cursor: pointer;
}
.console-head button:hover { color: var(--pink); }
#console {
  height: 168px; margin: 0; padding: 8px 12px;
  overflow-y: auto;
  background: #100f15;
  font-size: 12px; line-height: 1.55;
  white-space: pre-wrap; word-break: break-word;
}
#console div { color: var(--txt-dim); }
#console .out { color: var(--txt); }
#console .err { color: var(--amber); }
#console .sys { color: #5f5975; }
#console .fatal { color: var(--pink); }

/* ---------- bench (preview) ---------- */
.bench {
  display: grid; grid-template-rows: 1fr auto;
  min-width: 0; min-height: 0;
  overflow: hidden;
  background: var(--bench);
  color: var(--bench-txt);
}
.stagearea { display: grid; place-items: center; min-height: 0; padding: 20px; overflow: hidden; }
.device {
  transform: translate(var(--dx, 0px), var(--dy, 0px)) scale(var(--k));
  transform-origin: center center;
  padding: 14px;
  border-radius: 30px;
  background: linear-gradient(#312d3b, #201d28);
  box-shadow: 0 1px 0 rgba(255,255,255,.14) inset, 0 18px 34px -14px rgba(0,0,0,.55);
  cursor: grab;
  touch-action: none;
}
.device.dragging { cursor: grabbing; }
.speaker {
  width: 46px; height: 4px; margin: 0 auto 10px;
  border-radius: 2px; background: #15131c;
}
.screen {
  position: relative;
  width: 390px; height: 844px;
  overflow: hidden;
  border-radius: 18px;
  background: #000;
  box-shadow: 0 0 0 1px rgba(0,0,0,.6);
}
.screen iframe { display: block; width: 100%; height: 100%; border: 0; }
.screen .idle {
  position: absolute; inset: 0;
  display: grid; place-content: center; gap: 10px;
  color: #4a4458; text-align: center;
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
}

/* ---------- spec plate ---------- */
.plate {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 9px 16px;
  border-top: 1px solid var(--bench-3);
  background: var(--bench-2);
  font-size: 11px; letter-spacing: .07em;
}
.plate label { text-transform: uppercase; color: #57503f; letter-spacing: .12em; font-size: 10px; }
.plate select {
  padding: 4px 6px; border: 1px solid var(--bench-3); border-radius: 3px;
  background: var(--bench); color: var(--bench-txt); font-size: 11px;
}
.plate .val { font-variant-numeric: tabular-nums; }
.plate .sep { width: 1px; align-self: stretch; background: var(--bench-3); }
.status { display: flex; align-items: center; gap: 7px; text-transform: uppercase; letter-spacing: .12em; font-size: 10px; }
.led { width: 8px; height: 8px; border-radius: 50%; background: #8a8375; box-shadow: 0 0 0 1px rgba(0,0,0,.25) inset; }
.status[data-state="booting"] .led { background: var(--amber); animation: pulse .8s ease-in-out infinite; }
.status[data-state="running"] .led { background: var(--mint); box-shadow: 0 0 7px var(--mint); }
.status[data-state="paused"]  .led { background: #6f9fd8; }
.status[data-state="error"]   .led { background: var(--pink); box-shadow: 0 0 7px var(--pink); }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .status[data-state="booting"] .led { animation: none; } }

.hidden { display: none !important; }

/* ---------- mobile tab bar ---------- */
.mob-tabs { display: none; }

/* ---------- mobile: one panel at a time ---------- */
@media (max-width: 700px) {
  #app { grid-template-rows: 46px 1fr; }
  .split { grid-template-columns: 1fr; grid-template-rows: 1fr; padding-bottom: calc(50px + env(safe-area-inset-bottom)); }
  .editor, .bench {
    grid-column: 1; grid-row: 1;
    transition: opacity 100ms ease, visibility 100ms;
  }
  body.tab-editor .editor { opacity: 1; visibility: visible; z-index: 1; }
  body.tab-editor .bench  { opacity: 0; visibility: hidden;  z-index: 0; }
  body.tab-game   .bench  { opacity: 1; visibility: visible; z-index: 1; }
  body.tab-game   .editor { opacity: 0; visibility: hidden;  z-index: 0; }
  .grip { display: none; }
  #console { height: 100px; }

  .mob-tabs {
    display: flex;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--ink-2);
    border-top: 1px solid var(--ink-3);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .mob-tab {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px;
    padding: 6px 0;
    border: 0;
    background: transparent;
    color: var(--txt-dim);
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    cursor: pointer;
  }
  .mob-tab[aria-selected="true"] {
    color: var(--pink);
    box-shadow: inset 0 2px 0 var(--pink);
  }

  /* badge dot on Editor tab */
  .console-badge {
    display: none;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--amber);
    margin-left: 5px;
    vertical-align: middle;
  }
  body.has-log-badge .console-badge { display: inline-block; }

  /* last-line strip above tab bar */
  .console-strip {
    display: none;
    position: fixed;
    bottom: calc(50px + env(safe-area-inset-bottom));
    left: 0; right: 0;
    padding: 5px 12px;
    font-size: 11px;
    font-family: monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: var(--ink-2);
    border-top: 1px solid var(--ink-3);
    cursor: pointer;
    z-index: 99;
  }
  body.tab-game.has-log-badge .console-strip { display: block; }
  body.tab-game.has-log-badge .split { padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
  body.tab-game.has-log-badge.strip-err   .console-strip { color: var(--amber); }
  body.tab-game.has-log-badge.strip-fatal .console-strip { color: var(--pink); }
  body.tab-game.has-log-badge:not(.strip-err):not(.strip-fatal) .console-strip { color: var(--txt-dim); }
}
</style>
</head>

<!-- Source for the sandboxed runner document. Injected into an iframe on every run. -->
<script type="text/plain" id="runner-source">
(function () {
  var host = window.parent;
  var canvas = document.getElementById('canvas');

  function post(msg) { try { host.postMessage(msg, '*'); } catch (e) {} }

  function writeFile(Module, name, bytes) {
    if (typeof Module.FS_createDataFile === 'function') {
      Module.FS_createDataFile('/', name, bytes, true, true, true);
    } else if (Module.FS && typeof Module.FS.writeFile === 'function') {
      Module.FS.writeFile('/' + name, bytes);
    } else {
      throw new Error('This love.js build exports neither FS_createDataFile nor FS.');
    }
  }

  function boot(msg) {
    var t0 = performance.now();

    var Module = {
      canvas: canvas,
      arguments: ['./game.love'],
      INITIAL_MEMORY: msg.memory,
      TOTAL_MEMORY: msg.memory,
      locateFile: function (p) { return p; },
      print: function (t) { post({ type: 'log', stream: 'out', text: String(t) }); },
      printErr: function (t) { post({ type: 'log', stream: 'err', text: String(t) }); },
      setStatus: function (t) { if (t) post({ type: 'log', stream: 'sys', text: String(t) }); },
      preRun: [function () {
        try {
          writeFile(Module, 'game.love', msg.love);
        } catch (e) {
          post({ type: 'fatal', text: 'Could not write game.love into the virtual filesystem. ' + e });
        }
      }],
      onRuntimeInitialized: function () {
        post({ type: 'running', ms: Math.round(performance.now() - t0) });
        post({ type: 'caps', pause: typeof Module.pauseMainLoop === 'function' });
      },
      onAbort: function (what) { post({ type: 'fatal', text: 'Runtime aborted: ' + what }); }
    };

    if (msg.wasmModule) {
      Module.instantiateWasm = function (imports, success) {
        WebAssembly.instantiate(msg.wasmModule, imports).then(
          function (instance) { success(instance, msg.wasmModule); },
          function (e) { post({ type: 'fatal', text: 'WebAssembly.instantiate failed: ' + e }); }
        );
        return {};
      };
    } else if (msg.wasmBinary) {
      Module.wasmBinary = msg.wasmBinary;
    }

    // Non-modularised builds boot off a global Module. Modularised ones ignore
    // it, but keeping it here gives the parent a handle for pause/resume.
    window.Module = Module;

    var s = document.createElement('script');
    if (msg.glueUrl) {
      s.src = msg.glueUrl;
      s.onload = function () { start(Module); };
      s.onerror = function () { post({ type: 'fatal', text: 'Could not load the love.js glue script.' }); };
      document.body.appendChild(s);
    } else {
      // Inline scripts execute on append and never fire onload.
      s.textContent = msg.glueSource;
      document.body.appendChild(s);
      start(Module);
    }
    canvas.focus();
  }

  // love.js is built with MODULARIZE and EXPORT_NAME=Love, so the glue defines a
  // factory rather than booting itself. Older or forked builds may not, in which
  // case the glue has already consumed the global Module and there is nothing to do.
  function start(Module) {
    var factory = window.Love;
    if (typeof factory !== 'function') {
      post({ type: 'log', stream: 'sys', text: 'No Love() factory found; assuming a self-booting glue build.' });
      return;
    }
    try {
      var ready = factory(Module);
      if (ready && typeof ready.catch === 'function') {
        ready.catch(function (e) { post({ type: 'fatal', text: 'Module initialisation rejected: ' + e }); });
      }
    } catch (e) {
      post({ type: 'fatal', text: 'Love(Module) threw: ' + e });
    }
  }

  window.addEventListener('message', function (ev) {
    if (ev.source !== host) return;
    var m = ev.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'boot') { boot(m); return; }
    if (m.type === 'pause' && window.Module && window.Module.pauseMainLoop) window.Module.pauseMainLoop();
    if (m.type === 'resume' && window.Module && window.Module.resumeMainLoop) window.Module.resumeMainLoop();
  });

  window.addEventListener('error', function (e) {
    post({ type: 'log', stream: 'err', text: (e.message || 'Uncaught error') + (e.lineno ? ' (line ' + e.lineno + ')' : '') });
  });

  document.addEventListener('mousedown', function () { canvas.focus(); });

  // Key events inside the iframe never reach the host document, so forward the
  // editor shortcuts back up while the game holds focus.
  document.addEventListener('keydown', function (e) {
    if (!(e.metaKey || e.ctrlKey)) return;
    var k = e.key.toLowerCase();
    if (k === 'enter' || k === 's') { e.preventDefault(); post({ type: 'shortcut', key: k }); }
  });

  post({ type: 'hello' });
})();
</script>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Inlined runtime hook, left for anyone who wants a single-file build:
 * replace these two tokens with base64 of love.js and love.wasm. Left
 * unreplaced (the normal case), the page fetches ./love.js and
 * ./love.wasm from its own directory instead.
 * ------------------------------------------------------------------ */
const INLINE_GLUE_B64 = "__LOVE_JS_B64__";
const INLINE_WASM_B64 = "__LOVE_WASM_B64__";
const HAS_INLINE_RUNTIME = INLINE_GLUE_B64.charAt(0) !== "_";

const INITIAL_MEMORY = 33554432;
const STORAGE_KEY = "love-live-editor/project/v1";
const MAX_LOG_LINES = 600;
const TEXT_EXT = /\.(lua|txt|json|md|csv|glsl|frag|vert|vs|fs|cfg|ini|xml|ya?ml)$/i;
const AUTORUN_DELAY = 900;

const PRESETS = [
  ["iPhone SE", 375, 667],
  ["iPhone 14", 390, 844],
  ["iPhone 14 Pro Max", 430, 932],
  ["Pixel 7", 412, 915],
  ["Galaxy S8", 360, 740],
  ["Square 512", 512, 512],
  ["Landscape 800×450", 800, 450]
];

const DEFAULT_MAIN = `-- main.lua
-- Pick a library on the main menu, then take an interactive tour of its
-- public API. Switch sections with the tab bar up top; "< Menu" backs out.

local Clay = require("clay")
local Widgets = require("ui_widgets")

local DEMOS = {
  { key = "clay", label = "Clay", subtitle = "UI layout", sections = {
      { key = "layout",   label = "Layout",       module = require("demo_layout") },
      { key = "text",     label = "Text & Fonts", module = require("demo_text") },
      { key = "style",    label = "Style",        module = require("demo_style") },
      { key = "scroll",   label = "Scroll",       module = require("demo_scroll") },
      { key = "interact", label = "Interact",     module = require("demo_interact") },
      { key = "floating", label = "Floating",     module = require("demo_floating") },
  }},
  { key = "foley", label = "Foley", subtitle = "Procedural UI sound", sections = {
      { key = "soundboard",  label = "Sound Board",  module = require("demo_soundboard") },
      { key = "sounddesign", label = "Sound Design", module = require("demo_sounddesign") },
  }},
}

local activeDemo = nil -- nil = show the menu; otherwise a DEMOS[].key
local activeKey = nil   -- section key within the active demo
local wheelX, wheelY = 0, 0

function love.load()
  love.graphics.setBackgroundColor(Widgets.palette.bg[1], Widgets.palette.bg[2], Widgets.palette.bg[3])

  Clay.initialize(love.graphics.getDimensions())
  Clay.registerFont("default", love.graphics.newFont(15))
  Clay.registerFont("title", love.graphics.newFont(20))
  Clay.registerFont("display", function(size) return love.graphics.newFont(size) end)
end

function love.resize(w, h)
  Clay.setLayoutDimensions(w, h)
end

function love.wheelmoved(dx, dy)
  wheelX = wheelX + dx
  wheelY = wheelY + dy
end

function love.update(dt)
  Clay.setPointerState(love.mouse.getX(), love.mouse.getY(), love.mouse.isDown(1))
  Clay.updateScrollContainers(true, wheelX, wheelY, dt)
  wheelX, wheelY = 0, 0
end

local function findDemo(key)
  for _, demo in ipairs(DEMOS) do
    if demo.key == key then return demo end
  end
end

local function drawMenu()
  Clay.element({
    id = "MenuWrapper",

local function floatEqual(a, b)

local ATTACH_POINTS = {

  leftCenter   = { 0,   0.5 },
  leftBottom   = { 0,   1   },
  centerTop    = { 0.5, 0   },

-- ## Sizing constructors ------------------------------------------------------

Clay.sizing = {
  fit = function(minSize, maxSize)
    return { type = "fit", min = minSize or 0, max = maxSize or HUGE }
  end,
  grow = function(minSize, maxSize)
    return { type = "grow", min = minSize or 0, max = maxSize or HUGE }
  end,
  fixed = function(px)
    return { type = "fixed", min = px, max = px }
  end,
  percent = function(p)
    return { type = "percent", percent = p }
  end,

-- ## Declaration normalizers --------------------------------------------------
-- User config tables are never mutated; every element gets fresh internal
-- tables so shared config tables between elements are safe.

local function normalizeColor(c)
  if not c then return nil end
  return { c[1] or c.r or 0, c[2] or c.g or 0, c[3] or c.b or 0, c[4] or c.a or 1 }
end

local function normalizeSizingAxis(value)
  if value == nil then
    return { type = "fit", min = 0, max = HUGE }
  end
  local t = type(value)
  if t == "number" then
    return { type = "fixed", min = value, max = value }
  end
  if t == "string" then
    if value == "grow" then return { type = "grow", min = 0, max = HUGE } end
    if value == "fit" then return { type = "fit", min = 0, max = HUGE } end
    error(("clay: unknown sizing keyword %q (expected \\"grow\\" or \\"fit\\")"):format(value))
  end
  local kind = value.type or "fit"
  if kind == "percent" then
    -- min/max mirror clay's behavior where percent elements contribute zero
    -- height during the pre-Y-axis fit propagation pass.
    return { type = "percent", percent = value.percent or 0, min = 0, max = 0 }
  end
  local minSize = value.min or 0
  local maxSize = value.max
  if maxSize == nil or maxSize <= 0 then maxSize = HUGE end
  return { type = kind, min = minSize, max = maxSize }
end

local function normalizePadding(p)
  if p == nil then
    return { left = 0, right = 0, top = 0, bottom = 0 }
  end
  if type(p) == "number" then
    return { left = p, right = p, top = p, bottom = p }
  end
  local x, y = p.x or 0, p.y or 0
  return { left = p.left or x, right = p.right or x, top = p.top or y, bottom = p.bottom or y }
end

local function normalizeCornerRadius(c)
  if not c then
    return { topLeft = 0, topRight = 0, bottomLeft = 0, bottomRight = 0 }
  end
  if type(c) == "number" then
    return { topLeft = c, topRight = c, bottomLeft = c, bottomRight = c }
  end
  return {
    topLeft = c.topLeft or 0, topRight = c.topRight or 0,
    bottomLeft = c.bottomLeft or 0, bottomRight = c.bottomRight or 0,
  }
end

local function normalizeLayout(l)
  l = l or EMPTY
  local sizing = l.sizing or EMPTY
  local alignment = l.childAlignment or l.alignment or EMPTY
  local direction = l.layoutDirection or l.direction
  return {
    sizing = {
      width = normalizeSizingAxis(sizing.width),
      height = normalizeSizingAxis(sizing.height),
    },
    padding = normalizePadding(l.padding),
    childGap = l.childGap or 0,
    alignX = alignment.x or "left",
    alignY = alignment.y or "top",
    leftToRight = not (direction == "topToBottom" or direction == "column"),
  }
end

local DEFAULT_LAYOUT = normalizeLayout(nil)

local function normalizeBorder(b)
  if not b then return nil end
  local w = b.width
  local width
  if type(w) == "number" then
    width = { left = w, right = w, top = w, bottom = w, betweenChildren = 0 }
  elseif type(w) == "table" then
    width = {
      left = w.left or 0, right = w.right or 0, top = w.top or 0, bottom = w.bottom or 0,
      betweenChildren = w.betweenChildren or 0,
    }
  else
    return nil
  end
  if width.left == 0 and width.right == 0 and width.top == 0
      and width.bottom == 0 and width.betweenChildren == 0 then
    return nil
  end
  return { color = normalizeColor(b.color) or { 0, 0, 0, 1 }, width = width }

local function normalizeFloating(f)
  if not f then return nil end
  local attachTo = f.attachTo or "none"
  if attachTo == "none" then return nil end
  local ap = f.attachPoints or EMPTY
  local elementPoint, parentPoint = ap.element or "leftTop", ap.parent or "leftTop"
  if not ATTACH_POINTS[elementPoint] then elementPoint = "leftTop" end
  if not ATTACH_POINTS[parentPoint]  then parentPoint  = "leftTop" end
  return {
    attachTo = attachTo,
    offset = { x = f.offset and f.offset.x or 0, y = f.offset and f.offset.y or 0 },
    expand = { width = f.expand and f.expand.width or 0, height = f.expand and f.expand.height or 0 },
    parentId = f.parentId,
    zIndex = f.zIndex or 0,
    attachPoints = { element = elementPoint, parent = parentPoint },
    pointerCaptureMode = f.pointerCaptureMode or "capture",
    clipTo = f.clipTo or "none",

local function normalizeTextConfig(cfg)
  cfg = cfg or EMPTY
  return {
    color = normalizeColor(cfg.color or cfg.textColor) or WHITE,
    fontId = cfg.fontId or cfg.font or "default",
    fontSize = cfg.fontSize or 16,
    lineHeight = cfg.lineHeight or 0,
    wrapMode = cfg.wrapMode or "words",
    alignment = cfg.alignment or cfg.textAlignment or "left",
    userData = cfg.userData,
